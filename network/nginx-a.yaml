apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-a
data:
  default.conf: |
    server {
      listen 80;
      default_type text/plain;
      location / { return 200 "v1 host=$hostname\n"; }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-a
  labels:
    app: net-nginx
    version: v1
spec:
  nodeSelector:
    kubernetes.io/hostname: jiseok-netlab-worker
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: config
      configMap:
        name: nginx-a
